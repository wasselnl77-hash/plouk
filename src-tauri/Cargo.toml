[package]
name = "plouk"
version = "0.3.2"
description = "Plouk — a dark, minimal vinyl music player. Drop a Spotify playlist in and it plays."
authors = ["EHS"]
license = "MIT"
edition = "2021"

[features]
# Production build (embedded assets served over Tauri's custom protocol).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "plouk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "fs", "io-util", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
md-5 = "0.10"
signalsmith-stretch = "0.1"
tauri-plugin-opener = "2"
urlencoding = "2"
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
discord-rich-presence = "1"
souvlaki = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
