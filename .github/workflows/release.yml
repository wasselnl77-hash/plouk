name: Release

# Builds Plouk for Linux, macOS and Android whenever a version tag is pushed,
# and attaches everything to the GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLOUK_LASTFM_KEY: ${{ secrets.PLOUK_LASTFM_KEY }}
          PLOUK_LASTFM_SECRET: ${{ secrets.PLOUK_LASTFM_SECRET }}
        run: |
          # Signed update files need the update key. Releases must have it; test runs and forks can do without.
          UPDATES=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            UPDATES=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing, refusing to release without update signatures"
            exit 1
          fi
          npx --yes @tauri-apps/cli@2 build ${{ matrix.args }} "${UPDATES[@]}"

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb "out/plouk-${VERSION}-linux-amd64.deb"
            cp src-tauri/target/release/bundle/appimage/*.AppImage "out/plouk-${VERSION}-linux-x86_64.AppImage"
            # Update signatures (see the manifest job)
            for f in src-tauri/target/release/bundle/deb/*.deb.sig; do [ -e "$f" ] && cp "$f" "out/plouk-${VERSION}-linux-amd64.deb.sig"; done
            for f in src-tauri/target/release/bundle/appimage/*.AppImage.sig; do [ -e "$f" ] && cp "$f" "out/plouk-${VERSION}-linux-x86_64.AppImage.sig"; done
          elif [ "$RUNNER_OS" = "Windows" ]; then
            B=src-tauri/target/release/bundle/nsis
            cp $B/*.exe "out/plouk-${VERSION}-windows-x64-setup.exe"
            for f in $B/*.exe.sig; do [ -e "$f" ] && cp "$f" "out/plouk-${VERSION}-windows-x64-setup.exe.sig"; done
          else
            B=src-tauri/target/universal-apple-darwin/release/bundle
            cp $B/dmg/*.dmg "out/plouk-${VERSION}-macos-universal.dmg"
            # The updater swaps in the zipped app, not the dmg.
            for f in $B/macos/*.app.tar.gz; do [ -e "$f" ] && cp "$f" "out/plouk-${VERSION}-macos-universal.app.tar.gz"; done
            for f in $B/macos/*.app.tar.gz.sig; do [ -e "$f" ] && cp "$f" "out/plouk-${VERSION}-macos-universal.app.tar.gz.sig"; done
          fi
          ls -la out

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already has the Android SDK; just add what Plouk needs.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Signing key
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Without a key (a fork, or a test run) the APK is left unsigned. A release never is.
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::The ANDROID_KEY_* secrets are missing, refusing to release an unsigned APK"
              exit 1
            fi
            echo "::warning::No signing key, building an unsigned APK"
            exit 0
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/plouk-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/plouk-release.jks"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > src-tauri/gen/android/keystore.properties

      # Gradle calls back into `cargo tauri` (see gen/android/buildSrc), so use the cargo CLI here.
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        env:
          PLOUK_LASTFM_KEY: ${{ secrets.PLOUK_LASTFM_KEY }}
          PLOUK_LASTFM_SECRET: ${{ secrets.PLOUK_LASTFM_SECRET }}
        run: cargo tauri android build --apk --target aarch64 armv7 x86_64

      - name: Collect files
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release*.apk "out/plouk-${VERSION}-android.apk"
          ls -la out

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*

  # latest.json is what installed copies check (see src-tauri/src/updater.rs). It goes up last,
  # once every platform's files are on the release, so nobody is pointed at a file that isn't there yet.
  manifest:
    name: Update manifest
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p '*.sig' -D sigs
          python3 - "${GITHUB_REF_NAME#v}" "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME" <<'EOF'
          import datetime, json, sys
          version, base = sys.argv[1:]
          def entry(name):
              return {"signature": open(f"sigs/{name}.sig").read().strip(), "url": f"{base}/{name}"}
          deb = entry(f"plouk-{version}-linux-amd64.deb")
          appimage = entry(f"plouk-{version}-linux-x86_64.AppImage")
          mac = entry(f"plouk-{version}-macos-universal.app.tar.gz")
          windows = entry(f"plouk-{version}-windows-x64-setup.exe")
          json.dump({
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "linux-x86_64-deb": deb,
                  "linux-x86_64-appimage": appimage,
                  "linux-x86_64": appimage,
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64": windows,
              },
          }, open("latest.json", "w"), indent=2)
          EOF
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
